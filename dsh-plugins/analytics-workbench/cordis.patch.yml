# The analytics-workbench bundle patch: the business surface over dsh-base.
# A profile lists this bundle in dsh.profile.bundles; `dsh --profile <name>`
# applies this layer after @deepseek-ai/dsh-base. Rows here reference the
# package by name so Node module resolution finds the installed code.
#
# This layer mirrors the dsh-dev overlay's business row. The native dev brand
# assets row stays in scripts/dsh-dev/overlay.mjs because it resolves repository
# paths outside this package.
- insert:
    - id: analytics-workbench-ui
      name: '@shine-mage/dsh-analytics-workbench-b0'
#
# P3-2: the private kernel contract is configured, not inferred from ports.
# A deployment that does not use the legacy B0 port block sets the row config
# (all fields optional; `Config` rejects unknown keys):
#
#     - id: analytics-workbench-ui
#       name: '@shine-mage/dsh-analytics-workbench-b0'
#       config:
#         baseUrl: http://127.0.0.1:4315      # FastAPI run kernel origin
#         bridgeUrl: http://127.0.0.1:4316    # Host bridge the kernel calls back
#         runtimeToken: <explicit deployment capability, >= 32 url-safe chars>
#         gatewayToken: <only for the synthetic first-purchase commands>
#
# `baseUrl`/`bridgeUrl` must be bare `http://127.0.0.1:<port>` roots. Tokens
# belong in a private overlay (mode 0600), never in this checked-in file.
