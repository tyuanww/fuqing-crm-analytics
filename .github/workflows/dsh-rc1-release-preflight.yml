name: DSH rc1 release preflight

on:
  workflow_dispatch:
    inputs:
      source_archive_url:
        description: HTTPS URL for the reviewed rc1 hydrated source archive (.tar.zst)
        required: true
        type: string
      source_archive_sha256:
        description: SHA-256 of the hydrated source archive
        required: true
        type: string
      subject_archive_url:
        description: HTTPS URL for the reviewed rc1 subject-set archive
        required: true
        type: string
      source_sha:
        description: rc1 subject identity from the source and pack receipts
        required: true
        type: string
      runtime_bundle_url:
        description: HTTPS URL for the rc1 runtime bundle
        required: true
        type: string
      runtime_provenance_url:
        description: HTTPS URL for the rc1 runtime generated-bytes provenance
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Download reviewed rc1 inputs
        env:
          SOURCE_URL: ${{ inputs.source_archive_url }}
          SOURCE_SHA256: ${{ inputs.source_archive_sha256 }}
          SUBJECT_URL: ${{ inputs.subject_archive_url }}
          RUNTIME_URL: ${{ inputs.runtime_bundle_url }}
          RUNTIME_PROVENANCE_URL: ${{ inputs.runtime_provenance_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc1/source" "$RUNNER_TEMP/rc1/subject" "$RUNNER_TEMP/rc1/runtime"
          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_URL" --output "$RUNNER_TEMP/rc1/source/source.tar.zst"
          curl --fail --location --retry 3 --retry-all-errors "$SUBJECT_URL" --output "$RUNNER_TEMP/rc1/subject/subject.tar.zst"
          curl --fail --location --retry 3 --retry-all-errors "$RUNTIME_URL" --output "$RUNNER_TEMP/rc1/runtime/runtime.tar.zst"
          curl --fail --location --retry 3 --retry-all-errors "$RUNTIME_PROVENANCE_URL" --output "$RUNNER_TEMP/rc1/runtime/runtime-provenance.json"
          test "$(sha256sum "$RUNNER_TEMP/rc1/source/source.tar.zst" | awk '{print $1}')" = "$SOURCE_SHA256"
          tar --zstd -xf "$RUNNER_TEMP/rc1/subject/subject.tar.zst" -C "$RUNNER_TEMP/rc1/subject"
      - name: Run rc1 fail-closed preflight
        run: |
          set -euo pipefail
          node scripts/release/rc1-preflight.mjs \
            --source-archive "$RUNNER_TEMP/rc1/source/source.tar.zst" \
            --subject-root "$RUNNER_TEMP/rc1/subject/final-subject-set" \
            --source-sha "${{ inputs.source_sha }}" \
            --runtime-bundle "$RUNNER_TEMP/rc1/runtime/runtime.tar.zst" \
            --runtime-provenance "$RUNNER_TEMP/rc1/runtime/runtime-provenance.json" \
            --output-dir "$RUNNER_TEMP/rc1/result"
      - name: Upload rc1 preflight receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsh-rc1-preflight
          path: ${{ runner.temp }}/rc1/result/rc1-preflight.json
