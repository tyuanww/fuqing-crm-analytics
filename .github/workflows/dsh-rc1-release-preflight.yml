name: DSH rc1 release preflight

on:
  workflow_dispatch:
    inputs:
      source_archive_url:
        description: HTTPS URL for the reviewed rc1 source archive
        required: true
        type: string
      source_archive_sha256:
        description: SHA-256 of the source archive
        required: true
        type: string
      subject_archive_url:
        description: HTTPS URL for the reviewed rc1 subject-set archive
        required: true
        type: string
      source_sha:
        description: rc1 subject identity from the source and pack receipts
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Download reviewed rc1 inputs
        env:
          SOURCE_URL: ${{ inputs.source_archive_url }}
          SOURCE_SHA256: ${{ inputs.source_archive_sha256 }}
          SUBJECT_URL: ${{ inputs.subject_archive_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc1/source" "$RUNNER_TEMP/rc1/subject"
          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_URL" --output "$RUNNER_TEMP/rc1/source/source.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors "$SUBJECT_URL" --output "$RUNNER_TEMP/rc1/subject/subject.tar.zst"
          test "$(sha256sum "$RUNNER_TEMP/rc1/source/source.tar.gz" | awk '{print $1}')" = "$SOURCE_SHA256"
          tar --zstd -xf "$RUNNER_TEMP/rc1/subject/subject.tar.zst" -C "$RUNNER_TEMP/rc1/subject"
      - name: Run rc1 fail-closed preflight
        run: |
          set -euo pipefail
          node scripts/release/rc1-preflight.mjs \
            --source-archive "$RUNNER_TEMP/rc1/source/source.tar.gz" \
            --subject-root "$RUNNER_TEMP/rc1/subject/final-subject-set" \
            --source-sha "${{ inputs.source_sha }}" \
            --output-dir "$RUNNER_TEMP/rc1/result"
      - name: Upload rc1 preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-rc1-preflight
          path: ${{ runner.temp }}/rc1/result/rc1-preflight.json
