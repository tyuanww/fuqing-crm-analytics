name: CI

# 当前：所有 PR/main push 先用共用矩阵选择 job；普通文档只运行轻量计划。
# B0 合同构建并入本 workflow，避免与 dsh-b0.yml 各算一遍 changes。
# merge-gate 在 changes 失败或任一已选 job 失败/取消时失败；skip 不算失败。
# Sprint 41/83/85/87/123/129: e2e 分层、Node 24、ruff 自定义 step 等历史见 CHANGELOG
# 2026-07-25 PR5: permissions least-privilege、persist-credentials=false、
#   frontend/contract/FilterBuilder/audit jobs；lock/Docker/compose 变更触发

on:
  pull_request:
  push:
    branches: [main]

# 最小权限：默认只读 contents；禁止 GITHUB_TOKEN 写仓库
permissions:
  contents: read

# PR：同一 PR 的旧运行被新提交覆盖时取消，省掉重复的 30 分钟级 job。
# main：组键退化为分支 ref 且 cancel-in-progress=false，主线运行只排队、不互相取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/check-plan.yml

  lint:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate single Agent rule source (read-only)
        run: bash scripts/sync-agents.sh --check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt
      - name: Install only the locked Ruff version
        run: |
          python - <<'PYTHON'
          import pathlib, re, subprocess, sys
          pins = [line.strip() for line in pathlib.Path('requirements-lock.txt').read_text().splitlines()
                  if re.fullmatch(r'ruff==[0-9]+(?:\.[0-9]+){2}', line.strip())]
          if len(pins) != 1:
              raise SystemExit('Expected exactly one pinned Ruff requirement')
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', pins[0]], check=True)
          PYTHON
      - name: "Print python + ruff versions (Track A 2026-07-19)"
        run: |
          python --version
          ruff --version
      - name: "Run ruff check (Sprint 87 custom step, avoid ruff-action internal Node 20)"
        run: ruff check backend/

  ground-truth-lint:
    needs: changes
    if: needs.changes.outputs.ground_truth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Ground truth lint (B2 P1-3 + 二轮 B2 committed 模式)
        run: |
          python3 .githooks/check_review_ground_truth.py --committed --files \
            "docs/validation-reports/*.md" \
            "docs/飞书版架构文档/*.md"

  contract-filterbuilder-lint:
    needs: changes
    if: needs.changes.outputs.filterbuilder == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: FilterBuilder usage lint (L4.5)
        run: python3 backend/scripts/check_filter_builder_usage.py
      - name: Channel alias lint (L4.19)
        run: python3 backend/scripts/check_channel_alias.py

  test:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    # 与 nightly 的 45 分钟有界运行区分：PR 只跑有界 Python 计划，30 分钟足够；
    # 挂起即失败，避免 runner 被无限占用。
    timeout-minutes: 30
    # 4 shards on separate runners: same bounded runner, same selection, wall
    # time ~= the heaviest shard instead of the whole 332-file suite. fail-fast
    # stays off so one red shard cannot cancel the other three pieces of evidence.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      FQ_CRM_ADMINS: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Ensure standalone service artifact tools
        run: sudo apt-get install -y zstd
      - name: Run the same Python plan as local pre-push
        env:
          CHECK_PLAN: ${{ needs.changes.outputs.plan }}
          FQ_TEST_SHARD_INDEX: ${{ matrix.shard }}
          FQ_TEST_SHARD_COUNT: 4
        run: |
          python3 -c "import json, os; print('\n'.join(json.loads(os.environ['CHECK_PLAN'])['files']))" > changed-files.txt
          python3 scripts/ci/run_checks.py --files-from changed-files.txt --only ci-python
      - name: Upload bounded test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-check-evidence-shard-${{ matrix.shard }}
          path: .context/checks/
          if-no-files-found: ignore

  rc5-shadow:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    # P3-0/P3-1/P3-3c evidence only: the repository still pins rc.3, so rc.5
    # surface drift, the disposer ownership tests and the offline legacy↔ACP
    # projection compare are reported without blocking unrelated work. This job
    # is deliberately outside the 4-shard `test` matrix (they are not
    # Python-plan shards, so sharding would run each one four times) and outside
    # merge-gate.needs. Delete `continue-on-error` once the P0 rc.5 pin and the
    # P3-1/P3-3c follow-ups have landed.
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: rc.5 surface shadow gate (fail-closed, non-blocking)
        continue-on-error: true
        run: node scripts/ci/rc5-surface-gate.mjs --summary "$GITHUB_STEP_SUMMARY"
      - name: Connection Fetch disposer ownership shadow tests (non-blocking)
        continue-on-error: true
        run: >-
          node --test
          dsh-plugins/analytics-workbench/test/connection-fetch-ledger.test.mjs
          dsh-plugins/analytics-workbench/test/connection-fetch-ownership.test.mjs
          dsh-plugins/analytics-workbench/test/native-tools.test.mjs
          dsh-plugins/analytics-workbench/test/first-purchase-commands.test.mjs
          scripts/ci/rc5-surface-gate.test.mjs
      - name: rc.5 legacy↔ACP offline shadow compare (non-blocking)
        continue-on-error: true
        run: |
          node --test scripts/ci/rc5-shadow-classifier.test.mjs scripts/ci/rc5-shadow-compare.test.mjs
          node scripts/ci/rc5-shadow-compare.mjs \
            --fixtures scripts/ci/fixtures/rc5-shadow \
            --out .context/rc5-shadow/shadow-diff.json \
            --summary "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-vue3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-vue3/package-lock.json
      - name: npm ci (official registry via .npmrc; no --legacy-peer-deps)
        run: npm ci
      - name: Run the same frontend plan as local pre-push
        working-directory: .
        env:
          CHECK_PLAN: ${{ needs.changes.outputs.plan }}
        run: |
          python3 -c "import json, os; print('\n'.join(json.loads(os.environ['CHECK_PLAN'])['files']))" > changed-files.txt
          python3 scripts/ci/run_checks.py --files-from changed-files.txt --only frontend

  dependency-audit:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.python_dependencies == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.frontend_dependencies == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-vue3/package-lock.json
      - name: Install Python deps for pip-audit
        if: needs.changes.outputs.python_dependencies == 'true'
        run: |
          pip install -r requirements-lock.txt
          pip install pip-audit==2.10.1
      - name: pip-audit (requirements-lock)
        if: needs.changes.outputs.python_dependencies == 'true'
        run: pip-audit -r requirements-lock.txt --progress-spinner off
      - name: npm ci
        if: needs.changes.outputs.frontend_dependencies == 'true'
        working-directory: frontend-vue3
        run: npm ci
      - name: npm audit production only
        if: needs.changes.outputs.frontend_dependencies == 'true'
        working-directory: frontend-vue3
        run: npm audit --omit=dev --audit-level=high

  docker-smoke:
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 用 MB 级 seed DB 启动真实容器并探活；绝不复制生产 141GB DuckDB。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Backend Dockerfile build (no push)
        run: |
          set -euo pipefail
          for delay in 0 30 60 120; do
            if docker build -t fuqing-crm-backend:ci -f Dockerfile .; then
              exit 0
            fi
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
          done
          exit 1
      - name: Generate ephemeral test credentials (masked)
        # P0: 禁止 workflow 固定密码；每次 run 随机生成并 ::add-mask::
        run: |
          set -euo pipefail
          ADMIN_PASS=$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')
          FQSW_PASS=$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')
          TESTUSER_PASS=$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')
          CREDS="admin:${ADMIN_PASS},fqsw:${FQSW_PASS},testuser:${TESTUSER_PASS}"
          echo "::add-mask::${ADMIN_PASS}"
          echo "::add-mask::${FQSW_PASS}"
          echo "::add-mask::${TESTUSER_PASS}"
          echo "::add-mask::${CREDS}"
          {
            echo "FQ_CRM_PASSWORDS=${CREDS}"
            echo "E2E_ADMIN_USER=admin"
            echo "E2E_ADMIN_PASSWORD=${ADMIN_PASS}"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip'
      - run: pip install -r requirements-lock.txt
      - name: Seed tiny DuckDB fixture
        run: |
          set -euo pipefail
          DB_DIR="${RUNNER_TEMP}/fuqing-docker-smoke"
          mkdir -p "$DB_DIR"
          python3 scripts/ci/seed_e2e_duckdb.py "$DB_DIR/fuqing_crm.duckdb"
          chmod 0777 "$DB_DIR"
          chmod 0666 "$DB_DIR/fuqing_crm.duckdb"
      - name: Frontend Dockerfile build (no push)
        run: |
          set -euo pipefail
          for delay in 0 30 60 120; do
            if docker build -t fuqing-crm-frontend:ci -f frontend-vue3/Dockerfile frontend-vue3; then
              exit 0
            fi
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
          done
          exit 1
      - name: Run backend and frontend container smoke
        run: |
          set -euo pipefail
          DB_DIR="${RUNNER_TEMP}/fuqing-docker-smoke"
          SMOKE_NETWORK="fuqing-crm-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f fuqing-crm-backend-ci fuqing-crm-frontend-ci >/dev/null 2>&1 || true
          docker network rm "$SMOKE_NETWORK" >/dev/null 2>&1 || true
          cleanup() {
            docker rm -f fuqing-crm-backend-ci fuqing-crm-frontend-ci >/dev/null 2>&1 || true
            docker network rm "$SMOKE_NETWORK" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$SMOKE_NETWORK"
          docker run --detach \
            --name fuqing-crm-backend-ci \
            --network "$SMOKE_NETWORK" \
            --network-alias backend \
            --publish 127.0.0.1:18001:8001 \
            --volume "$DB_DIR:/app/data/processed" \
            --env DUCKDB_PATH=/app/data/processed/fuqing_crm.duckdb \
            --env FQ_DB_MODE=schema_test \
            --env FQ_CRM_PASSWORDS \
            fuqing-crm-backend:ci
          BACKEND_READY=false
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18001/api/v1/health >/dev/null; then
              BACKEND_READY=true
              break
            fi
            sleep 1
          done
          if [ "$BACKEND_READY" != "true" ]; then
            docker logs fuqing-crm-backend-ci
            exit 1
          fi
          docker rm -f fuqing-crm-frontend-ci >/dev/null 2>&1 || true
          docker run --detach \
            --name fuqing-crm-frontend-ci \
            --network "$SMOKE_NETWORK" \
            --publish 127.0.0.1:18080:8080 \
            fuqing-crm-frontend:ci
          FRONTEND_READY=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then
              FRONTEND_READY=true
              break
            fi
            sleep 1
          done
          if [ "$FRONTEND_READY" != "true" ]; then
            docker logs fuqing-crm-frontend-ci
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:18080/api/v1/health >/dev/null
          curl --fail --silent --head http://127.0.0.1:18080/ \
            | grep -i '^Content-Security-Policy:'

  b0-contract-build:
    needs: changes
    # b0 轴仍是"是否碰到 B0 相关路径"的唯一权威；b0_required 再把它收窄到
    # 组合包/锁文件/插件边界/发布相关输入，backend-only 变更不再跑 B0。
    # PR 已用同一棵树验证过 B0；merge 后重跑是纯重复（48h 窗口约 32 次 push
    # × ~15 分钟），push-to-main 不再执行。其余 job 与 merge-gate 的 skipped
    # 语义不变；B0 自身的本地/手动入口 dsh-b0.yml 与 test job 不受影响。
    if: needs.changes.outputs.b0 == 'true' && needs.changes.outputs.b0_required == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Each action's pinned action.yml declares node24. This is distinct from
      # the Node 24 runtime selected for our own build and verification below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Host evidence verifies controller bytes against a fixed prior commit.
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          test "$(pnpm --version)" = "11.28.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: '3.14'
      - name: Create B0-only Python environment
        env:
          B0_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$B0_PYTHON" -m venv .context/dsh-b0/python-env
          .context/dsh-b0/python-env/bin/python -m pip install --disable-pip-version-check -r scripts/dsh-b0/requirements.lock
      - name: Receive fixed Workbench author core evidence
        env:
          GH_TOKEN: ${{ secrets.SHINEMAGE_PLUGIN_READ_TOKEN }}
        run: |
          node scripts/ci/workbench-author-evidence.mjs \
            --output "$RUNNER_TEMP/workbench-author-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --python "$GITHUB_WORKSPACE/.context/dsh-b0/python-env/bin/python" --github-env "$GITHUB_ENV"
      - name: Receive fixed domain owner tests and original library input
        env:
          GH_TOKEN: ${{ secrets.SHINEMAGE_PLUGIN_READ_TOKEN }}
        run: |
          node scripts/ci/domain-author-evidence.mjs \
            --output "$RUNNER_TEMP/domain-author-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --python "$GITHUB_WORKSPACE/.context/dsh-b0/python-env/bin/python" --github-env "$GITHUB_ENV"
      - name: Receive fixed independent public compiler contracts
        env:
          GH_TOKEN: ${{ secrets.SHINEMAGE_PLUGIN_READ_TOKEN }}
        run: |
          node scripts/ci/public-contract-inputs.mjs \
            --output "$RUNNER_TEMP/public-contracts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --python "$GITHUB_WORKSPACE/.context/dsh-b0/python-env/bin/python" --github-env "$GITHUB_ENV"
      - name: Prepare sealed independent plugin packs for composition checks
        env:
          GH_TOKEN: ${{ secrets.SHINEMAGE_PLUGIN_READ_TOKEN }}
        run: |
          node scripts/ci/composition-pack-inputs.mjs \
            --artifact-lock "$GITHUB_WORKSPACE/config/shinemage-composition-artifact.lock.json" \
            --manifest "$GITHUB_WORKSPACE/config/shinemage-composition-pack-manifest.v1.json" \
            --output "$RUNNER_TEMP/shinemage-composition-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --python "$GITHUB_WORKSPACE/.context/dsh-b0/python-env/bin/python" \
            --github-env "$GITHUB_ENV"
      # The prepared closure is a pure function of the pinned upstream SHA,
      # both pnpm locks, the managers, the runner platform and this
      # repository's prepare-script closure. Cache exactly those bytes; a hit
      # skips only the preparation, never `--check` or the fixed evidence.
      - name: Resolve the B0 pnpm store
        id: b0-pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Compute the B0 preparation cache key
        id: b0-cache-key
        run: echo "key=$(node scripts/dsh-b0/prepare-cache.mjs --key)" >> "$GITHUB_OUTPUT"
      - name: Restore the prepared B0 closure
        id: b0-cache-restore
        # A cache outage must degrade to the cold path, never fail the gate.
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .context/dsh-b0/upstream-*
            .context/dsh-b0/runtime-inputs
            .context/dsh-b0/package-inputs
            dsh-plugins/plugin-kit/build-tools/node_modules
            ${{ steps.b0-pnpm-store.outputs.path }}
          key: ${{ steps.b0-cache-key.outputs.key }}
      - name: Verify the restored preparation or fall back to a full prepare
        id: b0-cache-guard
        env:
          B0_CACHE_HIT: ${{ steps.b0-cache-restore.outputs.cache-hit }}
        # The guard re-runs verifyPinnedSource(), the runtime preparation
        # receipt and both installed-lock digests. A mismatch removes the
        # restored bytes and returns 0 so the cold prepare below rebuilds them;
        # only an inability to remove them fails the step (fail closed).
        run: node scripts/dsh-b0/prepare-cache.mjs --guard
      - name: Prepare exact public DSH and private build tools
        if: steps.b0-cache-guard.outputs.verified != 'true'
        run: node scripts/dsh-b0/pipeline.mjs --prepare --python "$GITHUB_WORKSPACE/.context/dsh-b0/python-env/bin/python"
      - name: Verify the prepared closure before caching it
        if: steps.b0-cache-guard.outputs.verified != 'true'
        run: node scripts/dsh-b0/prepare-cache.mjs --verify
      - name: Save the verified B0 preparation
        if: steps.b0-cache-guard.outputs.verified != 'true'
        # A save failure (quota, transient outage) must not fail the gate.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .context/dsh-b0/upstream-*
            .context/dsh-b0/runtime-inputs
            .context/dsh-b0/package-inputs
            dsh-plugins/plugin-kit/build-tools/node_modules
            ${{ steps.b0-pnpm-store.outputs.path }}
          key: ${{ steps.b0-cache-key.outputs.key }}
      # `--prepare` also downloads the two pinned pnpm distributions into
      # Corepack's cache; the warm path must provide them for the offline
      # manager trials in `--check`.  This never touches prepared bytes and is
      # intentionally outside the cache key.
      - name: Prime the pinned package managers
        if: steps.b0-cache-guard.outputs.verified == 'true'
        run: node scripts/dsh-b0/prepare-managers.mjs
      - name: Main contracts and sealed plugin consumers with fixed author evidence
        run: node scripts/dsh-b0/pipeline.mjs --check --python "$GITHUB_WORKSPACE/.context/dsh-b0/python-env/bin/python"

  merge-gate:
    needs:
      - changes
      - lint
      - test
      - ground-truth-lint
      - contract-filterbuilder-lint
      - frontend
      - dependency-audit
      - docker-smoke
      - b0-contract-build
    if: always()
    runs-on: ubuntu-latest
    # 门禁本身只有几个 echo/结果判断步骤；超时只防 runner 挂起，不放宽判定。
    timeout-minutes: 10
    steps:
      - name: Path plan must succeed
        if: needs.changes.result != 'success'
        run: |
          echo "changes result=${{ needs.changes.result }}"
          exit 1
      - name: Selected checks must not fail or cancel
        if: >-
          needs.lint.result == 'failure' || needs.lint.result == 'cancelled' ||
          needs.test.result == 'failure' || needs.test.result == 'cancelled' ||
          needs.ground-truth-lint.result == 'failure' || needs.ground-truth-lint.result == 'cancelled' ||
          needs.contract-filterbuilder-lint.result == 'failure' || needs.contract-filterbuilder-lint.result == 'cancelled' ||
          needs.frontend.result == 'failure' || needs.frontend.result == 'cancelled' ||
          needs.dependency-audit.result == 'failure' || needs.dependency-audit.result == 'cancelled' ||
          needs.docker-smoke.result == 'failure' || needs.docker-smoke.result == 'cancelled' ||
          needs.b0-contract-build.result == 'failure' || needs.b0-contract-build.result == 'cancelled'
        run: |
          echo "a selected check failed or was cancelled"
          exit 1
      - name: Gate passed
        run: echo "changes succeeded; selected jobs succeeded or skipped"
