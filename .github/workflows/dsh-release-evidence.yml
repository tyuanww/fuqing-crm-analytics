name: DSH rc2 release evidence

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      reviewed_sha:
        required: true
        type: string
      approval_ref:
        required: true
        type: string
      preflight_run_id:
        description: 'Successful dsh-release-preflight run for the exact reviewed SHA'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: dsh-release-evidence-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    environment: dsh-release-evidence
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.14'
      - name: Check zstd release dependency
        run: |
          set -euo pipefail
          command -v zstd
          zstd --version
      - name: Refuse unreviewed or dirty source
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^dsh-[A-Za-z0-9._-]+$ ]]
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVAL_REF" =~ ^run:[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$REVIEWED_SHA"
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$GITHUB_SHA" = "$REVIEWED_SHA"
          git merge-base --is-ancestor origin/main "$REVIEWED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify release LFS assets are hydrated
        run: |
          set -euo pipefail
          # Keep release evidence deterministic when checkout's LFS cache did
          # not hydrate the reviewed object on a fresh runner.
          git lfs pull --include="frontend-vue3/src/assets/brand/shine-mage.png" --exclude=""
          git lfs checkout
          node --input-type=module -e "import { brandAssets } from './scripts/dsh-b0/brand-assets.mjs'; await brandAssets(process.cwd());"
      - name: Require a successful exact-SHA preflight
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/dsh-preflight"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN_ID" > "$RUNNER_TEMP/preflight-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/preflight-jobs.json"
          python3 - "$RUNNER_TEMP/preflight-run.json" "$RUNNER_TEMP/preflight-jobs.json" "$REVIEWED_SHA" <<'PY'
          import json, pathlib, sys
          run = json.loads(pathlib.Path(sys.argv[1]).read_text())
          jobs = json.loads(pathlib.Path(sys.argv[2]).read_text())
          expected = sys.argv[3]
          assert run.get('path') == '.github/workflows/dsh-release-preflight.yml', run.get('path')
          assert run.get('event') == 'workflow_dispatch', run.get('event')
          assert run.get('head_sha') == expected, (run.get('head_sha'), expected)
          assert run.get('status') == 'completed' and run.get('conclusion') == 'success', run
          preflight = [job for job in jobs.get('jobs', []) if job.get('name') == 'preflight']
          assert len(preflight) == 1 and preflight[0].get('conclusion') == 'success', preflight
          PY
          gh run download "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "dsh-rc2-preflight-$REVIEWED_SHA" \
            --dir "$RUNNER_TEMP/dsh-preflight"
          test -f "$RUNNER_TEMP/dsh-preflight/release-preflight.json"
      - name: Reuse the exact preflight runtime bundle and verify the complete release bundle
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { copyFile, mkdir } from 'node:fs/promises';
          import { join } from 'node:path';
          import { verifyPreflight, releaseAssetNames } from './scripts/release/preflight-bundle.mjs';
          const { RELEASE_TAG: tag, REVIEWED_SHA: sourceSha, RUNNER_TEMP, GITHUB_WORKSPACE } = process.env;
          const input = join(RUNNER_TEMP, 'dsh-preflight');
          await verifyPreflight(input, { tag, sourceSha });
          const output = join(GITHUB_WORKSPACE, '.context/release-evidence', tag);
          await mkdir(output, { recursive: true });
          for (const name of releaseAssetNames(tag)) await copyFile(join(input, name), join(output, name));
          JS
      - name: Attest the exact candidate source artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .context/release-evidence/${{ inputs.release_tag }}/${{ inputs.release_tag }}.tar.zst
      - name: Attest the exact pinned upstream runtime artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .context/release-evidence/${{ inputs.release_tag }}/shinemage-dsh-upstream-runtime-477b4f420553e8a52c2fbccc464d7561b239c443.tar.zst
      - name: Upload evidence (never publish)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dsh-rc2-evidence-${{ inputs.release_tag }}
          path: .context/release-evidence/${{ inputs.release_tag }}/
