name: DSH rc2 release preflight

on:
  pull_request:
    paths:
      - '.github/workflows/dsh-release-*.yml'
      - 'scripts/release/**'
      - 'scripts/dsh.mjs'
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Exact clean candidate commit to preflight before creating a protected tag'
        required: true
        type: string
      release_tag:
        description: 'Reserved final tag name; preflight creates no Git tag'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-release-preflight-${{ inputs.reviewed_sha || github.event.pull_request.head.sha }}-${{ inputs.release_tag || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha || github.event.pull_request.head.sha }}
      RELEASE_TAG: ${{ inputs.release_tag || format('dsh-preflight-{0}', github.event.pull_request.head.sha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # Hydrate the single allowlisted asset explicitly after checkout so
          # a runner-side LFS cache miss is observable in the verification
          # step rather than failing inside checkout's opaque post-action.
          lfs: false
          ref: ${{ inputs.reviewed_sha || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Activate the pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.7.0
          test "$(pnpm --version)" = "11.7.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: '3.14'
      - name: Verify the reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_SHA" = "$REVIEWED_SHA"
          fi
          git merge-base --is-ancestor origin/main "$REVIEWED_SHA"
          # actions/checkout runs with clean:true; keep this gate focused on
          # the reviewed commit identity so a runner-side LFS attribute probe
          # cannot mask the immutable source check below.
          # Keep the allowlisted brand bytes deterministic without depending
          # on Git LFS for the current source. Read the exact reviewed blob
          # first; historical reviewed SHAs that still contain an LFS pointer
          # use the authenticated Batch API compatibility path below.
          asset_rel='frontend-vue3/src/assets/brand/shine-mage.png'
          asset_tmp="$RUNNER_TEMP/shine-mage.png.partial"
          git show "${REVIEWED_SHA}:${asset_rel}" > "$asset_tmp"
          if [[ "$(sed -n '1p' "$asset_tmp")" == 'version https://git-lfs.github.com/spec/v1' ]]; then
            asset_pointer="$(cat "$asset_tmp")"
            asset_oid="$(printf '%s\n' "$asset_pointer" | sed -n 's/^oid sha256:\([0-9a-f]\{64\}\)$/\1/p')"
            asset_size="$(printf '%s\n' "$asset_pointer" | sed -n 's/^size \([0-9][0-9]*\)$/\1/p')"
            [[ "$asset_oid" =~ ^[0-9a-f]{64}$ ]]
            [[ "$asset_size" =~ ^[0-9]+$ ]]
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            batch_body="$(ASSET_OID="$asset_oid" ASSET_SIZE="$asset_size" node --input-type=module -e "console.log(JSON.stringify({operation:'download',transfers:['basic'],objects:[{oid:process.env.ASSET_OID,size:Number(process.env.ASSET_SIZE)}]}))")"
            batch_file="$RUNNER_TEMP/shine-mage-lfs-batch.json"
            lfs_tmp="$RUNNER_TEMP/shine-mage-lfs.partial"
            curl -fsSL --retry 3 --retry-all-errors -X POST \
              -H "Accept: application/vnd.git-lfs+json" \
              -H "Content-Type: application/vnd.git-lfs+json" \
              -H "Authorization: Basic $auth" \
              --data "$batch_body" \
              "https://github.com/${GITHUB_REPOSITORY}.git/info/lfs/objects/batch" \
              --output "$batch_file"
            asset_url="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const x=JSON.parse(await readFile(process.argv[1], 'utf8')); const d=x.objects?.[0]?.actions?.download; if (!d?.href) process.exit(1); console.log(d.href);" "$batch_file")"
            asset_header="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const x=JSON.parse(await readFile(process.argv[1], 'utf8')); const d=x.objects?.[0]?.actions?.download; if (d?.header?.Authorization) console.log(d.header.Authorization);" "$batch_file")"
            if [[ -n "$asset_header" ]]; then
              curl -fsSL --retry 3 --retry-all-errors -H "$asset_header" "$asset_url" --output "$lfs_tmp"
            else
              curl -fsSL --retry 3 --retry-all-errors "$asset_url" --output "$lfs_tmp"
            fi
            test "$(wc -c < "$lfs_tmp" | tr -d ' ')" = "$asset_size"
            test "$(sha256sum "$lfs_tmp" | awk '{print $1}')" = "$asset_oid"
            mv "$lfs_tmp" "$asset_tmp"
          fi
          asset_bytes="$(wc -c < "$asset_tmp" | tr -d ' ')"
          asset_sha="$(sha256sum "$asset_tmp" | awk '{print $1}')"
          printf 'release brand candidate bytes=%s sha256=%s first8=' "$asset_bytes" "$asset_sha"
          od -An -tx1 -N8 "$asset_tmp"
          test "$asset_bytes" = 3662
          test "$asset_sha" = 21b8273703b9015027b572cb830b8bb01e9fc406c39b14ec7c228fbcdcaf4000
          mkdir -p "$(dirname "$asset_rel")"
          mv "$asset_tmp" "$asset_rel"
          node --input-type=module -e "import { brandAssets } from './scripts/dsh-b0/brand-assets.mjs'; await brandAssets(process.cwd());"
      - name: Build the exact pinned runtime before tag creation
        env:
          B0_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          node scripts/dsh.mjs preflight \
            --python "$B0_PYTHON" \
            --source-sha "$REVIEWED_SHA" \
            --tag "$RELEASE_TAG" \
            --output-dir "$RUNNER_TEMP/dsh-preflight"
      - name: Upload the preflight runtime and summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dsh-rc2-preflight-${{ inputs.reviewed_sha || github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dsh-preflight/
          if-no-files-found: error
