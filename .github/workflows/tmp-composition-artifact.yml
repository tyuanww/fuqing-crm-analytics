name: temporary sealed composition artifact

on:
  push:
    branches:
      - codex/tmp-composition-artifact-20261021

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate sealed pack inventory
        run: |
          set -euo pipefail
          test "$(find .ci/composition-source/packs -type f | wc -l | tr -d ' ')" = 18
          jq -r '.plugins[] | [.directory, .manifest_sha256] | @tsv' config/shinemage-composition-packs.lock.json |
            while IFS=$'\t' read -r directory expected; do
              actual="$(sha256sum ".ci/composition-source/packs/${directory}/plugin-pack.json" | cut -d' ' -f1)"
              test "$actual" = "$expected"
            done
      - name: Upload sealed composition pack artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shinemage-sealed-composition-${{ github.sha }}
          path: .ci/composition-source/
          if-no-files-found: error
          retention-days: 90
