# Weekly dependency PRs — review majors (DuckDB etc.) manually; no auto-merge.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      # One PR for routine Python bumps; semver-major stays separate for manual
      # review (DuckDB and friends), matching the vitest group style below.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "duckdb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Pydantic 2.13.5 pins pydantic-core==2.46.5 exactly. Ignoring only the
      # core lets a lone pydantic minor bump land and make the lock
      # unsatisfiable (closed PR #220: pydantic 2.14.2 wants core 2.50.2).
      # Ignore both until one planned upgrade moves requirements.txt and the
      # two matching lock lines together; no auto-merge.
      - dependency-name: "pydantic"
        versions: [">2.13.5,<3.0.0"]
      - dependency-name: "pydantic-core"
        versions: [">2.46.5,<3.0.0"]
  - package-ecosystem: "npm"
    directory: "/frontend-vue3"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Routine JavaScript bumps travel together; majors stay separate for
      # manual review. Keep @rive-app/canvas apart: its upgrade also needs the
      # two hashed WASM bytes re-synced, so its failures must stay isolated
      # instead of taking an unrelated group PR down with it.
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["vitest", "@vitest/*", "@rive-app/canvas"]
        update-types: ["minor", "patch"]
    # vue-tsc 3.3.11 requires the JavaScript compiler API removed in TypeScript 7.
    # Revisit after upstream Vue SFC type checking supports the native compiler.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0 <8.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
