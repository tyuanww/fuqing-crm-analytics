# Weekly dependency PRs — review majors (DuckDB etc.) manually; no auto-merge.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    ignore:
      - dependency-name: "duckdb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "npm"
    directory: "/frontend-vue3"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    # vue-tsc 3.3.11 requires the JavaScript compiler API removed in TypeScript 7.
    # Revisit after upstream Vue SFC type checking supports the native compiler.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0 <8.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
